<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
</head>

<body>
  <h1>form pemesanan pizza</h1>
  <p>
    silahkan isi form pemesanan ini dengan lengkap dan benar.
  </p>
  
  <form action="hasil.html" method="post">
      <fieldset>
        <legend>Informasi pemesan</legend>
        <p>
            <label for="costomername">name:</label>
            <input type="text" id="costomername"required>
        </p>
        
         <p>
            <label for="address">address:</label>
            <input type="text" id="address"required>
        </p>
        
         <p>
            <label for="telephone">telephone:</label>
            <input type="text" id="telephone"required>
        </p>
        
       <p>
            <label for="email">email:</label>
            <input type="text" id="email" name="email" required>
        </p>
        
         <p>
            <label for="intruction">delivery instruction:</label><br>
            <textarea
                 id="intruction"
                 name="intruction"
                 rows="4"
                 cols="50"
                 maxlength="400"
                 placeholder="no more than 400 characters"></textarea>
        </p>
        </fieldset>
        
        <fieldset>
             <legend>desain your dream</legend>
             <p><strong>pizza specs</strong></p>
             <p>pilih salah satu</p>
             
             <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">classic white</label><br>
                
                <input type="radio" id="peperoni" name="crust" value="peperoni" required>
                <label for="peperoni">peperoni</label><br>
                
                <input type="radio" id="ayam" name="crust" value="ayam" required>
                <label for="ayam">ayam</label><br>
                
                <input type="radio" id="classic" name="crust" value="classic" required>
                <label for="classic">multigrain</label><br>
                 </p>
                 
                 <p><strong>topping</strong></p>
                 
                 <p>
                    <input type="checkbox" id="classic" name="topping" value="classic white">
                <label for="classic">red sauce</label><br>
                
                
                 <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">white sauce</label><br>
                
                
                <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">mozzarella cheese</label><br>
                
                
                <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">pepperoni</label><br>
                
                
                <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">mushrooms</label><br>
                
                
                 <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">peppers</label><br>
                
                
                 <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">anchovies</label><br>
                 </p>
                 
                 <p>
                   <label for="quantity">quantity:</label>
                   <select id="quantity" name="quantity" required>
                       <option value="">--pilih jumlah--</option>
                       <option value="1">1</option>
                       <option value="2">2</option>
                       <option value="3">3</option>
                        <option value45="4">4</option>
                         <option value="5">5</option>
                   </select>
                 </p>
                 
                 
                 <!-- Tombol Aksi Form -->
                 <div class="buttons">
                   <input type="submit" value="Bring me a pizza">
                   <input type="reset" value="Reset">
                 </div>
        </fieldset>
        
  </form>
</body>

</html>
